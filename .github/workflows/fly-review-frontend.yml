name: Fly Review App (Frontend)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

# Unrelated label churn gets a run-unique group: its all-skipped workflow cannot
# cancel a real preview deployment or cleanup. Desired-state events share the
# stable group and supersede stale work for this PR.
concurrency:
  group: preview-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'preview:visual') && github.run_id || 'desired-state' }}
  cancel-in-progress: true

env:
  PREVIEW_LABEL: preview:visual
  FLY_APP_PREFIX: ${{ secrets.FLY_APP_PREFIX || 'brain-buddy-frontend-pr' }}
  FLY_ORG: ${{ secrets.FLY_ORG }}
  FLY_REVIEW_BACKEND_ORIGIN: ${{ secrets.FLY_REVIEW_BACKEND_ORIGIN }}
  PRODUCTION_APP_NAMES: "brain-buddy-frontend brain-buddy-backend"
  PR_NUMBER: ${{ github.event.pull_request.number }}
  EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  REPO: ${{ github.repository }}

jobs:
  eligibility:
    name: Preview eligibility
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:visual') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'preview:visual') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:visual')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.paths.outputs.eligible }}
    steps:
      - name: Verify label, repository, target, state, and current head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          STATE: ${{ github.event.pull_request.state }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO_FULL_NAME" = "$REPO" || {
            echo "fork PR ineligible for secret-bearing preview" >&2
            exit 1
          }
          test "$BASE_REF" = "main" || {
            echo "pull request does not target main" >&2
            exit 1
          }
          test "$STATE" = "open" || {
            echo "pull request is not open" >&2
            exit 1
          }
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          CURRENT_HEAD_SHA=$(jq -r .head.sha <<< "$pr")
          test "$CURRENT_HEAD_SHA" = "$EVENT_HEAD_SHA" || {
            echo "stale event head; a newer run supersedes this one" >&2
            exit 1
          }
          test "$(jq -r .state <<< "$pr")" = "open"
          test "$(jq -r .base.ref <<< "$pr")" = "main"
          test "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO"
          jq -e --arg label "$PREVIEW_LABEL" '.labels | any(.name == $label)' <<< "$pr" >/dev/null || {
            echo "required label $PREVIEW_LABEL is absent" >&2
            exit 1
          }
          {
            echo "### Preview authorization"
            echo "- Actor: $ACTOR"
            echo "- Trigger: ${{ github.event.action }}"
            echo "- PR: #$PR_NUMBER"
            echo "- Head: $EVENT_HEAD_SHA"
            echo "- Label: $PREVIEW_LABEL"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate visual-path eligibility
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )
          eligible=false
          for file in "${files[@]}"; do
            case "$file" in
              */__tests__/*|*.test.*|*.spec.*|frontend/tests/*|frontend/test-results/*)
                ;;
              frontend/src/*|frontend/public/*|frontend/index.html|frontend/vite.config.*|frontend/tailwind.config.*|frontend/postcss.config.*)
                eligible=true
                break
                ;;
            esac
          done
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [ "$eligible" = true ]; then
            echo "Visual-path eligibility: accepted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Visual-path eligibility: rejected; no rendered frontend change found." >> "$GITHUB_STEP_SUMMARY"
          fi

  # No separate build job: `flyctl deploy` builds the same Dockerfile remotely
  # and fails before anything is released, and CI's `frontend` lane already
  # builds the bundle for this head.
  deploy:
    name: Deploy preview
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_API_TOKEN }}
      VITE_API_BASE_URL: /api
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.118

      - name: Derive and validate stable preview identity
        run: |
          set -euo pipefail
          printf '%s' "$FLY_APP_PREFIX" | grep -Eq '^[a-z0-9][a-z0-9-]{0,47}$' || {
            echo "invalid FLY_APP_PREFIX" >&2
            exit 1
          }
          APP_NAME="${FLY_APP_PREFIX}-${PR_NUMBER}"
          test "${#APP_NAME}" -le 63 || {
            echo "derived preview app name is too long" >&2
            exit 1
          }
          for production_app in $PRODUCTION_APP_NAMES; do
            test "$APP_NAME" != "$production_app" || {
              echo "refusing to target production app $APP_NAME" >&2
              exit 1
            }
          done
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://${APP_NAME}.fly.dev" >> "$GITHUB_ENV"

      - name: Re-verify PR immediately before remote mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          CURRENT_HEAD_SHA=$(jq -r .head.sha <<< "$pr")
          test "$CURRENT_HEAD_SHA" = "$EVENT_HEAD_SHA" || {
            echo "stale head sha; a newer run supersedes this one" >&2
            exit 1
          }
          test "$(jq -r .state <<< "$pr")" = "open"
          test "$(jq -r .base.ref <<< "$pr")" = "main"
          test "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO"
          jq -e --arg label "$PREVIEW_LABEL" '.labels | any(.name == $label)' <<< "$pr" >/dev/null

      - name: Create or observe the one stable app for this PR
        run: |
          set -euo pipefail
          create_args=("$APP_NAME")
          if [ -n "$FLY_ORG" ]; then
            create_args+=(--org "$FLY_ORG")
          fi
          # A close/unlabel run can be cancelled when the desired PR state
          # changes back to open+labeled. Reconcile that bounded race instead
          # of assuming the previous destroy completed atomically.
          for attempt in $(seq 1 10); do
            if flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
              break
            fi
            if flyctl apps create "${create_args[@]}"; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              echo "preview app did not stabilize after cleanup/create race" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Configure runtime secrets
        run: |
          set -euo pipefail
          if [ -n "$FLY_REVIEW_BACKEND_ORIGIN" ]; then
            flyctl secrets set BACKEND_ORIGIN="$FLY_REVIEW_BACKEND_ORIGIN" -a "$APP_NAME"
          fi

      - name: Deploy exact review candidate
        run: |
          flyctl deploy --app "$APP_NAME" --config fly.frontend.toml --remote-only \
            --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL"

      - name: Smoke check preview reachability
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/" >/dev/null

      - name: Publish stable preview evidence
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- brain-buddy-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Visual preview',
              `- URL: ${process.env.PREVIEW_URL}`,
              `- Head: \`${process.env.DEPLOYED_SHA}\``,
              `- Smoke: passed`,
              `- Deployed: ${new Date().toISOString()}`,
              `- Workflow: ${runUrl}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            await core.summary.addHeading('Visual preview').addLink(process.env.PREVIEW_URL, process.env.PREVIEW_URL).addCodeBlock(process.env.DEPLOYED_SHA).addRaw('Smoke: passed').write();

  cleanup:
    name: Cleanup preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:visual'))
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_API_TOKEN }}
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.118

      - name: Derive and validate cleanup target
        run: |
          set -euo pipefail
          test "$REPO" = "${{ github.event.pull_request.base.repo.full_name }}"
          test "$PR_NUMBER" -gt 0
          printf '%s' "$FLY_APP_PREFIX" | grep -Eq '^[a-z0-9][a-z0-9-]{0,47}$' || {
            echo "invalid FLY_APP_PREFIX" >&2
            exit 1
          }
          APP_NAME="${FLY_APP_PREFIX}-${PR_NUMBER}"
          test "${#APP_NAME}" -le 63
          for production_app in $PRODUCTION_APP_NAMES; do
            test "$APP_NAME" != "$production_app" || {
              echo "refusing to target production app $APP_NAME" >&2
              exit 1
            }
          done
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Destroy only this PR preview when present
        run: |
          set -euo pipefail
          if flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            flyctl apps destroy "$APP_NAME" --yes
          else
            echo "Preview already absent: $APP_NAME"
          fi

      - name: Verify preview absence
        run: |
          if flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            echo "preview cleanup failed: $APP_NAME still exists" >&2
            exit 1
          fi
          echo "Cleanup verified for $APP_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish cleanup evidence
        uses: actions/github-script@v9
        env:
          APP_NAME: ${{ env.APP_NAME }}
        with:
          script: |
            const marker = '<!-- brain-buddy-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Visual preview',
              `- State: removed`,
              `- App: \`${process.env.APP_NAME}\``,
              `- Trigger: ${context.payload.action}`,
              `- Verified: ${new Date().toISOString()}`,
              `- Workflow: ${runUrl}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
