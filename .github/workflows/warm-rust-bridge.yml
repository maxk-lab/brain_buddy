name: Warm Rust Apple bridge cache

on:
  # Only when the bridge's inputs change. A new Xcode on the runner image also
  # changes the key, and the nightly CI run re-warms that case: its iOS and Mac
  # lanes run on main and save the same entries on a miss.
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "ios/scripts/build-rust-bridge.sh"
      - "ios/scripts/select-xcode.sh"
      - ".github/workflows/warm-rust-bridge.yml"

permissions:
  contents: read

concurrency:
  group: warm-rust-bridge-main
  cancel-in-progress: false

jobs:
  warm:
    name: Warm ${{ matrix.name }} bridge
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full Apple
            apple_targets: ""
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          - name: Mac only
            apple_targets: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Xcode 26
        run: bash ios/scripts/select-xcode.sh

      - name: Key the Rust bridge on its inputs
        id: bridge-key
        env:
          BB_APPLE_TARGETS: ${{ matrix.apple_targets }}
        run: |
          inputs="$(git rev-parse HEAD:rust HEAD:ios/scripts/build-rust-bridge.sh)
          $(xcodebuild -version)
          $(uname -m)
          ${BB_APPLE_TARGETS:-all}"
          echo "key=rust-bridge-apple-$(printf '%s' "${inputs}" | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore or save the Rust bridge
        id: bridge-cache
        uses: actions/cache@v6
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: |
            ios/BrainBuddyKit/Artifacts/BrainBuddyRustFFI.xcframework
            ios/BrainBuddyKit/Sources/BrainBuddyRustBindings/BrainBuddyRustBindings.swift

      - name: Install pinned Rust on cache miss
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.rust_targets }}

      - name: Build the Rust bridge on cache miss
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        env:
          BB_APPLE_TARGETS: ${{ matrix.apple_targets }}
        run: |
          sh ios/scripts/build-rust-bridge.sh apple 2>&1 \
            | sed -e "s|${GITHUB_WORKSPACE}|<workspace>|g" \
                -e "s|${HOME}|<home>|g" \
                -e "s|${RUNNER_TEMP}|<runner-temp>|g"
