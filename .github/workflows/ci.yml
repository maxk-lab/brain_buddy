name: CI

on:
  push:
    # trunk-candidate/** refs run the same required full CI as main. This
    # workflow definition is candidate-controlled (it runs from the pushed
    # ref), so it deliberately holds NO write permission and never promotes:
    # landing (fast-forwarding main) is owned exclusively by the
    # default-branch deploy-fly-production.yml workflow, which consumes this
    # run's completion via workflow_run (ADR-0008). A candidate that edits
    # this file therefore cannot grant itself the power to land.
    branches: ["main", "trunk-candidate/**"]
  pull_request:
    # `stack/**` so a stacked pull request gets the same full CI as one
    # targeting main. Without it a stack is unreviewable: only the base PR
    # runs anything, and every slice above it shows four skipped preview jobs
    # and no evidence at all. These refs are pull-request runs, which carry no
    # write permission and cannot promote — landing stays owned by the
    # default-branch deploy workflow, exactly as for `main`.
    branches: ["main", "stack/**"]
  # Nightly, on main: the macOS and Windows lanes a landing skipped because
  # nothing they read changed still meet a new Xcode or runner image within a
  # day. Consumers of this workflow's completion (the landing/deploy workflow
  # and the TestFlight upload) act on push runs only, so this never lands or
  # ships anything.
  schedule:
    - cron: "41 2 * * *"
  # The merge queue tests each queued pull request on top of the current main
  # (and the entries ahead of it) before merging, so a PR does not have to be
  # re-run by hand every time main moves. A queue run carries no write
  # permission and cannot promote; its required checks are the same jobs.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Every required lane verifies the reviewed PR head or the exact pushed SHA.
env:
  BRAIN_BUDDY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel a superseded pull_request run so a new push to the same PR does not
# keep paying for stale runs. The group falls back to github.ref for push
# events, and cancel-in-progress is false there, so main push CI is never
# cancelled by a later push queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Validate Brain Buddy design skill contracts
        run: python3 -m unittest scripts/test_validate_brain_buddy_design_skill.py -v

      - name: Validate CI artifact contracts
        run: python3 -m unittest scripts/test_validate_ci_artifacts.py -v

      - name: Validate CI artifact contract
        run: |
          python3 scripts/validate_ci_artifacts.py workflow \
            --ci .github/workflows/ci.yml \
            --frontend-vite-config frontend/vite.config.ts \
            --disallow-workflow frontend/.github/workflows/playwright.yml
          python3 scripts/validate_ci_artifacts.py mutation-workflow \
            --workflow .github/workflows/mutation-quality.yml \
            --frontend-stryker-config frontend/stryker.config.json
          python3 scripts/validate_ci_artifacts.py preview-workflow \
            --workflow .github/workflows/fly-review-frontend.yml

      # A file excluded from the coverage report reads as covered, so the floor
      # can be met while a third of the source is unmeasured. It happened here.
      - name: Reject blanket coverage suppressions
        run: |
          python3 scripts/validate_ci_artifacts.py coverage-suppressions \
            --path frontend/src

      - name: Validate the frontend mutation tiers
        run: |
          python3 scripts/validate_ci_artifacts.py mutation-scope \
            --config frontend/stryker.config.json \
            --enforced frontend/mutation-enforced-scope.txt

      - name: Validate verified-trunk delivery contract
        run: |
          python3 -m unittest scripts/test_validate_trunk_delivery.py -v
          python3 -m unittest scripts/test_submit_to_trunk.py -v
          python3 -m unittest scripts/test_production_smoke.py -v
          python3 -m unittest scripts/test_capture_fly_release_image.py -v
          python3 -m unittest scripts/test_classify_path_risk.py -v
          python3 -m unittest scripts/test_check_smoke_identity_cohort.py -v
          python3 -m unittest scripts/test_select_backend_tests.py -v
          python3 -m unittest scripts/test_ci_shards.py -v
          python3 -m unittest scripts/test_release_graph.py -v
          python3 -m unittest scripts/test_classify_changed_scripts.py -v
          python3 scripts/validate_trunk_delivery.py trunk-ci \
            --ci .github/workflows/ci.yml
          python3 scripts/validate_trunk_delivery.py deploy \
            --workflow .github/workflows/deploy-fly-production.yml

      - name: Validate the secret-scan guardrails
        run: python3 -m unittest scripts/test_secret_scan_guardrails.py -v

  # The secret scan has to be a job HERE, not a workflow of its own.
  #
  # A candidate lands by pushing trunk-candidate/<sha>, and the only verdict the
  # default-branch release workflow consumes is the `Full CI` join below. A scan
  # living in its own workflow is advisory for that path: it can be red while
  # Full CI is green, and the candidate lands with the leak in it. Called from
  # here it is inside the required graph, and because a skipped required job
  # fails Full CI, a candidate cannot evade it by skipping it either.
  #
  # The scan itself stays defined once, in secret-scan.yml, which keeps the
  # checksum-pinned Gitleaks install in one place and runs it exactly once per
  # event. This job holds no `needs`: it is an independent cheap lane.
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  # Which stacks a pull request actually touches. Every stack job still RUNS --
  # it just skips its expensive steps when nothing relevant changed. Skipping
  # the jobs themselves would produce a 'skipped' result, and ADR-0008 requires
  # Full CI to treat that as a failure so a candidate can never land on the
  # strength of a check that did not happen. A job that runs, finds nothing to
  # do, and succeeds keeps that guarantee intact.
  #
  # Pull requests are filtered lane by lane. Pushes to main and to
  # trunk-candidate/** are the landing path and verify every Linux lane in
  # full; the lanes on macOS and Windows runners follow the filter on a
  # candidate, are not re-run on a main push of a SHA already verified as a
  # candidate, and run nightly on main regardless (see the decide step).
  # This job holds no `needs`. It is the only real data dependency the stack
  # lanes have, so nothing may sit in front of it: a lint gate queued ahead of
  # it would delay every test in the run without changing any of their results.
  changes:
    name: Changed stacks
    runs-on: ubuntu-latest
    # actions: read lets the decide step find this SHA's trunk-candidate run.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      ios: ${{ steps.decide.outputs.ios }}
      ios_kit: ${{ steps.decide.outputs.ios_kit }}
      macos: ${{ steps.decide.outputs.macos }}
      rust: ${{ steps.decide.outputs.rust }}
      cli: ${{ steps.decide.outputs.cli }}
      floor-backend: ${{ steps.decide.outputs.floor-backend }}
      floor-frontend: ${{ steps.decide.outputs.floor-frontend }}
      mutation: ${{ steps.mutation_scope.outputs.mutation }}
      mutation_scope: ${{ steps.mutation_scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the floor comparison below needs a merge base, and
          # this is the one job that pays for it on behalf of the others.
          fetch-depth: 0

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      # Computed with plain git rather than a paths-filter action. Such actions
      # read the changed-file list from the pull-requests API, which this
      # workflow's deliberately minimal `contents: read` token cannot do
      # ("Resource not accessible by integration"). Widening the token to suit a
      # convenience is the wrong trade on a candidate-controlled workflow
      # (ADR-0008), and doing it in git costs nothing and adds no third-party
      # action to the supply chain.
      #
      # Every branch of this fails safe toward running MORE: an unreadable diff
      # exercises every stack.
      - name: Decide which stacks to exercise
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          backend=true
          frontend=true
          ios=true
          ios_kit=true
          macos=true
          rust=true
          cli=true

          candidate=false
          case "${{ github.event_name }}:${{ github.ref }}" in
            push:refs/heads/trunk-candidate/*) candidate=true ;;
            # A merge-queue run is the landing path for pull requests: the
            # same rules as a trunk candidate, judged against its fork point
            # on main (the queue's base).
            merge_group:*) candidate=true ;;
          esac

          if [ "${{ github.event_name }}" = "pull_request" ] ||
             [ "${candidate}" = true ]; then
            if [ "${candidate}" = true ]; then
              # A candidate is judged by what it changes on top of main.
              # An unknown fork point leaves base empty, and the empty diff
              # below then fails toward exercising every stack.
              base=$(git merge-base HEAD origin/main 2>/dev/null) || base=""
            else
              base='${{ github.event.pull_request.base.sha }}'
            fi
            # --no-renames lists a moved file's old path too: a lane that
            # still reads the old name is affected even though only the new
            # name would otherwise show.
            # A candidate's fork point is already in the full-history checkout.
            if [ -n "${base}" ] &&
               { [ "${candidate}" = true ] ||
                 git fetch --no-tags --depth=1 origin "${base}" 2>/dev/null; } &&
               changed=$(git diff --name-only --no-renames "${base}" HEAD 2>/dev/null); then
              printf '%s\n' "${changed}" | sed 's/^/  /'

              # The workflow itself is a shared surface: a change to CI can
              # alter any stack's result, so it exercises everything.
              #
              # The repository's tooling directory and its make targets are
              # not, wholesale. Most of what lives there is spec and delivery
              # tooling that only the always-running jobs execute, so treating
              # it as shared queued macOS and Windows runners for edits none of
              # them could observe. classify_changed_scripts.py (below) names
              # the lanes that read each changed file, through their jobs,
              # their source trees and the tooling that names it, and widens
              # exactly those, or every lane when it cannot tell.
              #
              # `compose.yaml` is deliberately NOT a shared surface. Its only
              # consumer is the Compose stack that `e2e` boots, and `e2e` is
              # never path filtered, so a Compose edit is always exercised there.
              # No stack lane reads the file (the backend and frontend suites,
              # the native apps, the Rust core and the CLI all run without
              # Compose), so listing it here only queued macOS and Windows
              # runners for a change none of them could observe.
              tooling=$(printf '%s\n' "${changed}" |
                python3 scripts/classify_changed_scripts.py \
                  --workflow .github/workflows/ci.yml) ||
                tooling=all
              if printf '%s\n' "${changed}" | grep -Eq '^\.github/' ||
                 [ "${tooling}" = all ]; then
                echo "shared surface touched; exercising every stack"
              else
                # Spec 026: the backend wheel compiles the PyO3 bridge from rust/.
                printf '%s\n' "${changed}" | grep -Eq '^(backend|rust)/' || backend=false
                printf '%s\n' "${changed}" | grep -q '^frontend/' || frontend=false
                # The native app builds from ios/ alone: nothing outside it
                # (apart from the shared surfaces above) is compiled into it
                # or read by its tests. Its sync tests run against the Swift
                # fake server in ios/, so a backend change is not an input.
                # The one outside input is the Rust bridge it links (spec 026):
                # rust/bindings/swift is built into the kit by ios-kit/ios-app
                # from the whole workspace (lockfile, toolchain pin and the
                # crates it depends on), so any rust/ change is an input.
                printf '%s\n' "${changed}" | grep -Eq '^(ios|rust)/' || ios=false
                # The kit lane builds and tests ios/BrainBuddyKit/ alone, plus
                # the Rust bridge it links (built by ios/scripts/). The iPhone
                # app, its widgets, ios/Shared and the XcodeGen project are not
                # compiled into the package, so a change confined to them is
                # proved by ios-app and leaves the Linux kit lane idle.
                printf '%s\n' "${changed}" | grep -Eq '^(ios/BrainBuddyKit|ios/scripts|rust)/' || ios_kit=false
                # The Mac app builds from macos/ and, from 021-mac-sync on,
                # links the shared kit in ios/BrainBuddyKit/, so a kit change
                # rebuilds and retests the Mac too. It also runs the bridge and
                # Xcode-selection scripts in ios/scripts/. The rest of ios/ (the
                # iPhone app, its widgets, the XcodeGen project) is not an
                # input to the Mac and leaves this lane idle.
                printf '%s\n' "${changed}" | grep -Eq '^(macos|ios/BrainBuddyKit|ios/scripts|rust)/' || macos=false
                # The shared Rust core builds from rust/ alone, plus the frozen
                # sync contract its codec tests read: that schema is an input.
                printf '%s\n' "${changed}" | grep -Eq '^(rust|specs/026-rust-core-sync/contracts)/' || rust=false
                # The CLI is its own Cargo workspace with no path dependency on
                # rust/, so cli/ is its only source input. Its Linux journey
                # test drives the real backend, which the cli-native job handles
                # by also reading the backend output for that one target.
                printf '%s\n' "${changed}" | grep -q '^cli/' || cli=false
                # A tooling file a lane reads exercises that lane.
                for lane in ${tooling}; do
                  case "${lane}" in
                    backend) backend=true ;;
                    frontend) frontend=true ;;
                    ios) ios=true ;;
                    ios_kit) ios_kit=true ;;
                    macos) macos=true ;;
                    rust) rust=true ;;
                    cli) cli=true ;;
                    *) echo "unknown lane ${lane}; exercising every stack"
                       backend=true frontend=true ios=true ios_kit=true
                       macos=true rust=true cli=true ;;
                  esac
                done
                [ -z "${tooling}" ] || echo "tooling read by: ${tooling//$'\n'/ }"
              fi
            else
              echo "could not read the diff against ${base}; exercising every stack"
            fi
            if [ "${candidate}" = true ]; then
              # The landing path still verifies every Linux lane in full. Only
              # the lanes on scarce macOS and Windows runners (the iOS app, the
              # Mac app, the CLI targets) follow the filter above, so a landing
              # that touches nothing they read leaves them idle; the nightly
              # run covers what the filter cannot see, such as a new Xcode.
              echo "trunk candidate; Linux lanes in full, iOS/Mac/CLI by the filter"
              backend=true
              frontend=true
              ios_kit=true
              rust=true
            fi
          elif [ "${{ github.event_name }}" = schedule ]; then
            echo "nightly; exercising the iOS, Mac and CLI lanes only"
            backend=false
            frontend=false
            ios_kit=false
            rust=false
          elif [ "${{ github.event_name }}" = push ] &&
               [ "${{ github.ref }}" = refs/heads/main ] &&
               verified=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=success&head_sha=${GITHUB_SHA}" \
                 --jq '[.workflow_runs[] | select((.event == "push" and (.head_branch | startswith("trunk-candidate/"))) or (.event == "merge_group" and (.head_branch | startswith("gh-readonly-queue/"))))] | length') &&
               [ "${verified}" -gt 0 ]; then
            # A trunk landing fast-forwards main to the exact SHA whose
            # candidate run already passed full CI, and the merge queue does
            # the same with the SHA its queue run tested, so this push
            # re-verifies an identical tree. The macOS and Windows lanes are
            # the scarce runners and have no consumer of a second result; the
            # Linux lanes still run (the backend one builds the test-selection
            # map on main). A pull request merged outside the queue has no such
            # run and is verified in full, as is any push the query cannot
            # vouch for.
            echo "main at ${GITHUB_SHA} passed full CI as a trunk candidate or queue run; not re-running the iOS, Mac and CLI lanes"
            ios=false
            macos=false
            cli=false
          else
            echo "landing path; exercising every stack regardless of the diff"
          fi

          # Did this branch itself edit a coverage floor? Three-dot, so the
          # answer is about what the BRANCH changed since it diverged, not what
          # the base branch has done meanwhile. A branch that merely fell behind
          # a raised floor must not be accused of lowering it.
          for stack in backend frontend; do
            touched=false
            if [ "${{ github.event_name }}" = "pull_request" ] &&
               git diff --name-only \
                 '${{ github.event.pull_request.base.sha }}...HEAD' \
                 -- "${stack}/coverage-floor.json" 2>/dev/null | grep -q .; then
              touched=true
            fi
            echo "floor-${stack}=${touched}" >> "$GITHUB_OUTPUT"
            echo "floor-${stack}=${touched}"
          done

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "ios=${ios}"
            echo "ios_kit=${ios_kit}"
            echo "macos=${macos}"
            echo "rust=${rust}"
            echo "cli=${cli}"
          } >> "$GITHUB_OUTPUT"
          echo "backend=${backend} frontend=${frontend} ios=${ios} ios_kit=${ios_kit} macos=${macos} rust=${rust} cli=${cli}"

      # The mutation gate's scope is computed separately and far more narrowly
      # than the stack filter above: ADR-0004 requirement 1 runs it only over
      # enforced-tier files a change actually touches, so the shared-surface
      # widening deliberately does not apply here. Editing CI does not make a
      # tree_service campaign meaningful.
      #
      # The landing path is different, and not for symmetry: SHIP/SHOW changes
      # land by pushing trunk-candidate/** with no pull request at all
      # (ADR-0008), so that push is the only gate those changes ever meet. It
      # measures the whole enforced list.
      - name: Decide the enforced mutation scope this change touches
        id: mutation_scope
        run: |
          enforced=backend/mutation-enforced-scope.txt

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            if git fetch --no-tags --depth=1 origin "${base}" 2>/dev/null &&
               git diff --name-only "${base}" HEAD > /tmp/mutation-changed.txt 2>/dev/null; then
              # The allow-list is written relative to backend/, the diff is not.
              sed -i 's|^backend/||' /tmp/mutation-changed.txt
            else
              # Fails safe toward measuring MORE, as the stack filter does.
              echo "could not read the diff against ${base}; measuring the whole enforced list"
              sed 's/#.*//' "${enforced}" | sed '/^[[:space:]]*$/d' > /tmp/mutation-changed.txt
            fi
          elif [ "${{ github.event_name }}" = schedule ]; then
            # The nightly run is for the native lanes; mutation-quality.yml
            # owns the nightly mutation campaign.
            echo "nightly; no mutation scope"
            : > /tmp/mutation-changed.txt
          else
            echo "landing path; measuring the whole enforced list"
            sed 's/#.*//' "${enforced}" | sed '/^[[:space:]]*$/d' > /tmp/mutation-changed.txt
          fi

          python3 scripts/mutation_gate.py scope \
            --enforced "${enforced}" \
            --changed /tmp/mutation-changed.txt > /tmp/mutation-scope.txt
          cat /tmp/mutation-scope.txt

          if [ -s /tmp/mutation-scope.txt ]; then mutation=true; else mutation=false; fi
          {
            echo "mutation=${mutation}"
            echo "scope=$(tr '\n' ' ' < /tmp/mutation-scope.txt)"
          } >> "$GITHUB_OUTPUT"
          echo "mutation=${mutation}"

  # Validates the markdown under specs/ and the gate scripts themselves. It
  # shares no input and no artifact with any stack lane, so it is a lane of its
  # own; `full-ci` is where its result is required, not the stack lanes' `needs`.
  spec-kit:
    name: Spec Kit artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Validate feature specs
        run: |
          make check-specs
          python3 -m unittest scripts/test_check_spec_kit_specs.py -v
          python3 scripts/check_spec_kit_specs.py
          python3 -m unittest scripts/test_validate_pre_freeze_receipt.py -v

      # The gate-integrity guard asserts that `make check-specs` runs it, but
      # nothing ran `make check-specs` here — so the guard, its invariants and
      # the preserved-override check were all absent from CI and an actor could
      # weaken its own gate on a green build. That is the exact defect class the
      # guard exists for, reintroduced by omission one layer up.
      - name: Validate the gates themselves
        run: |
          python3 -m unittest scripts/test_check_speckit_manifests.py -v
          python3 -m unittest scripts/test_check_gate_integrity.py -v
          python3 -m unittest scripts/test_spec_kit_planning_review.py -v
          python3 -m unittest scripts/test_render_feature_report.py -v
          python3 scripts/check_speckit_manifests.py
          python3 scripts/check_gate_integrity.py

  backend:
    name: Backend (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    needs: changes
    # The job always runs; RUN gates its expensive steps. See the `changes` job
    # for why this is not a job-level `if`.
    env:
      RUN: ${{ needs.changes.outputs.backend }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Set up Python
        if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Spec 026: the backend wheel compiles the PyO3 core bridge (maturin), so
      # every install of it needs the pinned toolchain. Keep the version equal
      # to rust/rust-toolchain.toml and the Rust core lane below.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0

      # The editable install compiles the PyO3 bridge into rust/target, about a
      # minute per job when cold. Only a push to main writes the entry (from one
      # shard), so pull requests and merge groups restore main's build without
      # spending the repository's shared cache quota on copies of their own.
      - name: Cache the backend Rust bridge build
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: backend-wheel
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 }}

      - name: Install dependencies
        if: env.RUN == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The static checks read the whole tree, not a shard's tests, so one shard
      # runs them; both would only report the same verdict twice.
      - name: Ruff lint
        if: env.RUN == 'true' && matrix.shard == 0
        run: ruff check app tests

      # Never checked in CI before, so 33 of 145 files had drifted out of
      # black's format despite black being the documented formatter.
      - name: Format check
        if: env.RUN == 'true' && matrix.shard == 0
        run: black --check app tests

      - name: Type check
        if: env.RUN == 'true' && matrix.shard == 0
        run: mypy app

      # Architectural fitness functions: the layering documented in CLAUDE.md is
      # enforced here rather than left to review.
      - name: Import contracts
        if: env.RUN == 'true' && matrix.shard == 0
        run: lint-imports

      # Test-impact selection (pull requests only). Every push to main records
      # which test files execute which app/ files (`--cov-context=test`) and
      # caches that map; a pull request restores the newest one and runs only
      # the tests on record for the files it changed. The selector narrows the
      # run for one kind of change alone -- edits inside function bodies of
      # measured app/*.py files -- and answers ALL for everything else (see
      # scripts/select_backend_tests.py), so it fails toward running MORE.
      # Landing pushes never select: main and trunk-candidate/** run the whole
      # suite and the coverage floor exactly as before.
      - name: Restore the backend test-impact map
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/backend-test-map.json
          key: backend-test-map-${{ github.event.pull_request.base.sha }}
          restore-keys: backend-test-map-

      - name: Select the backend tests this change can affect
        id: select
        if: env.RUN == 'true'
        working-directory: .
        env:
          MAP: ${{ runner.temp }}/backend-test-map.json
          # A branch that edits the coverage floor needs the whole suite to
          # measure against it.
          FLOOR_TOUCHED: ${{ needs.changes.outputs.floor-backend }}
        run: |
          selection="${RUNNER_TEMP}/backend-selected-tests.txt"
          echo ALL > "${selection}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "landing path; running the whole suite"
          elif [ "${FLOOR_TOUCHED}" = "true" ]; then
            echo "this branch edits the coverage floor; running the whole suite"
          elif [ ! -s "${MAP}" ]; then
            echo "no test-impact map restored; running the whole suite"
          else
            map_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "${MAP}")
            git fetch --no-tags --depth=1 origin "${map_sha}" 2>/dev/null || true
            python3 scripts/select_backend_tests.py select --map "${MAP}" --repo . > "${selection}"
          fi
          if [ "$(head -n 1 "${selection}")" = "ALL" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=selected" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend test selection"
              echo "Ran $(wc -l < "${selection}") test files chosen from the test-impact map:"
              echo '```'
              cat "${selection}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "selection=${selection}" >> "$GITHUB_OUTPUT"

      - name: Collect and partition the complete selected-or-full suite
        if: env.RUN == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_COUNT: '2'
          CI_SHARD_SHA: ${{ env.BRAIN_BUDDY_CANDIDATE_SHA }}
          CI_SHARD_MODE: ${{ steps.select.outputs.mode }}
          CI_SHARD_DIR: shard-evidence
          MODE: ${{ steps.select.outputs.mode }}
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          selected=()
          if [ "${MODE}" = selected ]; then mapfile -t selected < "${SELECTION}"; fi
          pytest -p scripts.ci_shards --collect-only -q -o addopts='' "${selected[@]}"

      - name: Run pytest with coverage and Allure
        id: pytest
        if: env.RUN == 'true'
        run: |
          # An empty @file would run default testpaths: never invoke it.
          if [ ! -s shard-evidence/pytest-args.txt ]; then
            echo 'exit-code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '[run]\nbranch = True\nrelative_files = True\nsource = app\n' > "${RUNNER_TEMP}/coverage.ini"
          contexts=()
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            contexts=(--cov-context=test)
          fi
          set +e
          pytest -n auto --dist loadgroup --cov=app --cov-report=term --cov-report= \
            --cov-config="${RUNNER_TEMP}/coverage.ini" --cov-fail-under=0 "${contexts[@]}" \
            --alluredir=shard-evidence/allure-results --junitxml="${RUNNER_TEMP}/backend-junit.xml" \
            @shard-evidence/pytest-args.txt
          pytest_status=$?
          echo "exit-code=${pytest_status}" >> "$GITHUB_OUTPUT"
          exit "${pytest_status}"

      - name: Record backend execution and safe coverage evidence
        if: always() && env.RUN == 'true'
        run: |
          python3 ../scripts/ci_shards.py backend-record --assignment shard-evidence/assignment.json \
            --junit "${RUNNER_TEMP}/backend-junit.xml" --coverage .coverage \
            --output shard-evidence/manifest.json --sha "${BRAIN_BUDDY_CANDIDATE_SHA}" \
            --index "${{ matrix.shard }}" --count 2 --mode "${{ steps.select.outputs.mode }}" \
            --exit-code "${{ steps.pytest.outputs.exit-code }}"
          if [ -f .coverage ]; then cp .coverage shard-evidence/.coverage; fi

      - name: Upload backend shard evidence
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}
          path: backend/shard-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  backend-results:
    name: Backend combined results
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, backend]
    env:
      RUN: ${{ needs.changes.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"
      - name: Set up Python
        if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download available backend diagnostics
        if: always() && env.RUN == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: backend-shard-*
          path: backend-shards
      - name: Combine complete backend results and coverage
        id: merge
        if: always() && env.RUN == 'true'
        run: |
          python3 scripts/ci_shards.py backend-version --artifacts backend-shards \
            --output-dir backend --sha "${BRAIN_BUDDY_CANDIDATE_SHA}"
          python3 -m pip install "coverage==$(cat backend/coverage-version.txt)"
          make verify-ci-shard-coverage
          python3 scripts/ci_shards.py backend-merge --artifacts backend-shards \
            --output-dir backend --sha "${BRAIN_BUDDY_CANDIDATE_SHA}"
          echo "mode=$(cat backend/mode.txt)" >> "$GITHUB_OUTPUT"
          test "${{ needs.backend.result }}" = success

      - name: Build the backend test-impact map
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        run: |
          python3 ../scripts/select_backend_tests.py build-map --coverage .coverage \
            --backend-root . --source-sha "${BRAIN_BUDDY_CANDIDATE_SHA}" \
            --output "${RUNNER_TEMP}/backend-test-map.json"

      - name: Verify the combined test-impact map is nonempty
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/backend-test-map.json")); assert d["files"], "empty combined test-impact map"'

      - name: Save the backend test-impact map
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/backend-test-map.json
          key: backend-test-map-${{ github.sha }}

      - name: Enforce backend coverage floor
        if: env.RUN == 'true' && steps.merge.outputs.mode == 'full'
        working-directory: .
        run: |
          # The floor may only ratchet upward, so a branch that EDITS the floor
          # is also checked against the base branch's copy. The `changes` job
          # decided whether this branch edited it, using a three-dot diff.
          #
          # A branch that did not touch the floor is exempt, and that exemption
          # is load-bearing: without it, a branch that merely fell behind a
          # raised floor would fail a check it never provoked, with a message
          # accusing it of lowering the bar. Whatever the base raised the floor
          # to simply wins at merge.
          base_args=()
          if [ "${{ needs.changes.outputs.floor-backend }}" = "true" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git fetch --no-tags --depth=1 origin "${base}" 2>/dev/null || true
            if git show "${base}:backend/coverage-floor.json" \
                 > /tmp/base-backend-floor.json 2>/dev/null; then
              base_args=(--base-floor "/tmp/base-backend-floor.json")
            fi
          fi
          python3 scripts/validate_coverage_floor.py --stack backend --format cobertura \
            --report backend/coverage.xml --floor backend/coverage-floor.json "${base_args[@]}"

      - name: Validate backend Allure results
        if: always() && env.RUN == 'true'
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path backend/allure-results --label backend-pytest

      - name: Upload backend Allure results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-allure-results
          path: backend/allure-results
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload coverage artifact
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Set up Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          # The frontend toolchain needs Node 22 (frontend/Dockerfile already
          # builds on node:22): jsdom 30 pulls undici 8, which needs >= 22.19;
          # Stryker 10 refuses anything below 22; allure 3.16's quality gate
          # uses Iterator helpers that Node 20 lacks. Every job that installs
          # frontend/package-lock.json pins the same version.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.RUN == 'true'
        run: npm ci

      - name: ESLint lint
        if: env.RUN == 'true'
        run: npm run lint

      - name: Run unit tests with coverage and Allure
        if: env.RUN == 'true'
        run: npm run test:coverage

      - name: Enforce frontend coverage floor
        if: env.RUN == 'true'
        working-directory: .
        run: |
          # The floor may only ratchet upward, so a branch that EDITS the floor
          # is also checked against the base branch's copy. The `changes` job
          # decided whether this branch edited it, using a three-dot diff.
          #
          # A branch that did not touch the floor is exempt, and that exemption
          # is load-bearing: without it, a branch that merely fell behind a
          # raised floor would fail a check it never provoked, with a message
          # accusing it of lowering the bar. Whatever the base raised the floor
          # to simply wins at merge.
          base_args=()
          if [ "${{ needs.changes.outputs.floor-frontend }}" = "true" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git fetch --no-tags --depth=1 origin "${base}" 2>/dev/null || true
            if git show "${base}:frontend/coverage-floor.json" \
                 > /tmp/base-frontend-floor.json 2>/dev/null; then
              base_args=(--base-floor "/tmp/base-frontend-floor.json")
            fi
          fi
          python3 scripts/validate_coverage_floor.py --stack frontend --format istanbul-summary \
            --report frontend/coverage/coverage-summary.json --floor frontend/coverage-floor.json "${base_args[@]}"

      - name: Validate frontend Allure results
        if: always() && env.RUN == 'true'
        working-directory: .
        run: python3 scripts/validate_allure_taxonomy.py --path frontend/allure-results/vitest --label frontend-vitest

      - name: Upload frontend Allure results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-allure-results
          path: frontend/allure-results/vitest
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Build frontend bundle
        if: env.RUN == 'true'
        run: npm run build

      - name: Upload coverage artifact
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # The native iOS app (ios/, docs/native-ios-app.md) as two service lanes.
  # They live here, not in a workflow of their own, for the reason the secret
  # scan does: a trunk candidate lands on the `Full CI` verdict alone, so an
  # iOS check anywhere else is advisory and a candidate could land with its
  # package tests red or its app unbuilt. Their results are Swift Testing and
  # xcodebuild output, not Allure: nothing here feeds `allure-report`.
  #
  # The package lane: every BrainBuddyKit target builds and passes its tests on
  # Linux (ios/AGENTS.md), where the GTD rules and the sync engine are tested.
  ios-kit:
    name: iOS kit on Linux (Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.ios_kit }}
    defaults:
      run:
        shell: bash
        working-directory: ios/BrainBuddyKit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Show the toolchain
        if: env.RUN == 'true'
        run: swift --version

      # Spec 026: BrainBuddyCore links the shared Rust core through the UniFFI
      # bridge (rust/bindings/swift), built here rather than committed. rustup needs
      # curl and cargo needs a C linker driver, which the Swift image does not promise.
      - name: Install build tools for Rust
        if: env.RUN == 'true'
        working-directory: .
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl gcc libc6-dev

      # Keep the version equal to rust/rust-toolchain.toml and the Rust core lane.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0

      # The bridge is a pure function of the committed rust/ tree, the script
      # that builds it and the toolchain that compiles and links it, so it is
      # cached under exactly those and rebuilt only when one of them changes.
      # The git tree id covers every committed file under rust/, the
      # rust-toolchain.toml pin included. A pull request reads only its own
      # entries and main's, never another branch's.
      - name: Key the Rust bridge on its inputs
        id: bridge-key
        if: env.RUN == 'true'
        working-directory: .
        run: |
          inputs="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD:rust HEAD:ios/scripts/build-rust-bridge.sh)
          $(swift --version 2>&1)
          $(cc --version | head -n 1)
          $(uname -m)"
          echo "key=rust-bridge-linux-$(printf '%s' "${inputs}" | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust bridge
        id: bridge-cache
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: |
            ios/BrainBuddyKit/Artifacts/linux
            ios/BrainBuddyKit/Sources/BrainBuddyRustFFI/include/BrainBuddyRustFFI.h
            ios/BrainBuddyKit/Sources/BrainBuddyRustBindings/BrainBuddyRustBindings.swift

      - name: Build the Rust bridge
        if: env.RUN == 'true'
        working-directory: .
        env:
          CACHE_HIT: ${{ steps.bridge-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            echo "Rust bridge restored for these exact inputs; nothing to build"
            exit 0
          fi
          sh ios/scripts/build-rust-bridge.sh linux

      - name: Build the package
        if: env.RUN == 'true'
        run: swift build

      - name: Test the package
        if: env.RUN == 'true'
        run: swift test --parallel

  # The shared Rust core workspace (feature 026). Format, lint and tests for
  # every crate under rust/, on the same pinned toolchain as the CLI. Like the
  # other stack lanes it always runs and gates its steps on RUN, so a change that
  # leaves rust/ alone still reports success instead of "skipped" (ADR-0008).
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      # Dependencies only; the workspace crates always rebuild. Written by main
      # alone, like the backend bridge cache.
      - name: Cache the Rust core build
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # bb-python (the PyO3 bridge) links libpython for `cargo test`/`clippy`.
      - name: Set up Python
        if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check formatting
        if: env.RUN == 'true'
        run: cargo fmt --check

      - name: Lint
        if: env.RUN == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        if: env.RUN == 'true'
        run: cargo test --locked

  # The app lane: the XcodeGen project builds the app, the widget extension and
  # the package for the simulator (unsigned), and the package tests pass on
  # macOS too. With nothing iOS to check it runs its no-op on Linux instead of
  # queueing for a macOS runner, and still reports success. It does not build
  # the Mac package: the Mac lane below owns macos/, and its filter includes
  # ios/BrainBuddyKit/, so a kit change still rebuilds and retests the Mac there.
  ios-app:
    name: iOS app on macOS (Xcode 26)
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.ios }}
      # XcodeGen is the release zip of this version, checked against this
      # SHA-256 and against `xcodegen --version`. Bump both together, taking the
      # hash from the downloaded asset (`shasum -a 256 xcodegen.zip`); ios.yml
      # pins the same pair for the TestFlight archive.
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Select the newest Xcode 26
        if: env.RUN == 'true'
        run: bash ios/scripts/select-xcode.sh

      # Spec 026: the app, the widget extension and the package link the shared Rust
      # core as a static XCFramework built from rust/bindings/swift (device, simulator
      # and macOS slices), not committed. Keep the version equal to rust/rust-toolchain.toml.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      # Cached under its inputs exactly as the ios-kit lane caches the Linux
      # bridge; here the selected Xcode is the toolchain that links it. A cold
      # build of all five slices is most of this lane's wall clock.
      - name: Key the Rust bridge on its inputs
        id: bridge-key
        if: env.RUN == 'true'
        run: |
          inputs="$(git rev-parse HEAD:rust HEAD:ios/scripts/build-rust-bridge.sh)
          $(xcodebuild -version)
          $(uname -m)
          ${BB_APPLE_TARGETS:-all}"
          echo "key=rust-bridge-apple-$(printf '%s' "${inputs}" | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust bridge
        id: bridge-cache
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: |
            ios/BrainBuddyKit/Artifacts/BrainBuddyRustFFI.xcframework
            ios/BrainBuddyKit/Sources/BrainBuddyRustBindings/BrainBuddyRustBindings.swift

      - name: Build the Rust bridge
        if: env.RUN == 'true'
        env:
          CACHE_HIT: ${{ steps.bridge-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            echo "Rust bridge restored for these exact inputs; nothing to build"
            exit 0
          fi
          sh ios/scripts/build-rust-bridge.sh apple

      - name: Install XcodeGen (pinned, checksum-verified)
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen.zip"
          curl --fail --location --silent --show-error --output "${archive}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          version="$("${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version)"
          echo "${version}"
          if [[ "${version}" != *"${XCODEGEN_VERSION}"* ]]; then
            echo "::error::Expected XcodeGen ${XCODEGEN_VERSION}, got: ${version}"
            exit 1
          fi
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate the Xcode project
        if: env.RUN == 'true'
        working-directory: ios
        run: xcodegen generate --spec project.yml

      # The raw log is kept for the failure artifact; the console gets
      # xcbeautify's annotations when the runner has it.
      - name: Build app and widgets for the iOS Simulator
        if: env.RUN == 'true'
        working-directory: ios
        run: |
          # Report every target's errors in one run instead of stopping at the first.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild \
            -project BrainBuddy.xcodeproj \
            -scheme BrainBuddy \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -resultBundlePath "${RUNNER_TEMP}/BrainBuddy.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 \
            | tee "${RUNNER_TEMP}/xcodebuild.log" \
            | if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi

      - name: Upload build logs
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/BrainBuddy.xcresult
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  ios-tests:
    name: iOS package tests on macOS (Xcode 26)
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.ios }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Select the newest Xcode 26
        if: env.RUN == 'true'
        run: bash ios/scripts/select-xcode.sh

      # Spec 026: the app, the widget extension and the package link the shared Rust
      # core as a static XCFramework built from rust/bindings/swift (device, simulator
      # and macOS slices), not committed. Keep the version equal to rust/rust-toolchain.toml.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      # Cached under its inputs exactly as the ios-kit lane caches the Linux
      # bridge; here the selected Xcode is the toolchain that links it. A cold
      # build of all five slices is most of this lane's wall clock.
      - name: Key the Rust bridge on its inputs
        id: bridge-key
        if: env.RUN == 'true'
        run: |
          inputs="$(git rev-parse HEAD:rust HEAD:ios/scripts/build-rust-bridge.sh)
          $(xcodebuild -version)
          $(uname -m)
          ${BB_APPLE_TARGETS:-all}"
          echo "key=rust-bridge-apple-$(printf '%s' "${inputs}" | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust bridge
        id: bridge-cache
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: |
            ios/BrainBuddyKit/Artifacts/BrainBuddyRustFFI.xcframework
            ios/BrainBuddyKit/Sources/BrainBuddyRustBindings/BrainBuddyRustBindings.swift

      - name: Build the Rust bridge
        if: env.RUN == 'true'
        env:
          CACHE_HIT: ${{ steps.bridge-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            echo "Rust bridge restored for these exact inputs; nothing to build"
            exit 0
          fi
          sh ios/scripts/build-rust-bridge.sh apple

      - name: Test the package on macOS
        if: env.RUN == 'true'
        working-directory: ios/BrainBuddyKit
        run: swift test --parallel


  # The native Mac app (macos/, 021-mac-sync research R3), a service lane of
  # the same kind as ios-app and here for the same reason: a trunk candidate
  # lands on the `Full CI` verdict alone, so a Mac check anywhere else would be
  # advisory. Before this lane a change confined to macos/ turned every stack
  # off and landed on a green Full CI that never compiled it.
  #
  # It is the one lane that builds and tests the Swift package in macos/, with
  # the runner's Xcode 26 toolchain. It does not run build_app.sh: the Whisper
  # model assets that script bundles are not in the repository, and the tests do
  # not need the .app. Its results are XCTest output, not Allure, so nothing here feeds the
  # aggregate report; allure-report still waits for it so the report closes a
  # finished run. With nothing Mac-relevant to check it runs its no-op on Linux
  # instead of queueing for a macOS runner, and still reports success.
  macos-app:
    name: Mac app on macOS (Xcode 26)
    runs-on: ${{ needs.changes.outputs.macos == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.macos }}
    defaults:
      run:
        # Load-bearing: an explicit `bash` runs with -eo pipefail, so a failing
        # `swift build`/`swift test` piped into `| tee` below still fails its step.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Select the newest Xcode 26
        if: env.RUN == 'true'
        run: bash ios/scripts/select-xcode.sh

      - name: Show the toolchain
        if: env.RUN == 'true'
        run: swift --version

      # Spec 026: the shared kit links the Rust core as a static XCFramework built
      # from rust/bindings/swift, not committed. The Mac needs only its own slice.
      # Keep the version equal to rust/rust-toolchain.toml.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Cached under its inputs as in the iOS lanes. The Mac's two-slice
      # XCFramework differs from the iPhone's five-slice one, so the target
      # list is part of the key.
      - name: Key the Rust bridge on its inputs
        id: bridge-key
        if: env.RUN == 'true'
        env:
          BB_APPLE_TARGETS: aarch64-apple-darwin x86_64-apple-darwin
        run: |
          inputs="$(git rev-parse HEAD:rust HEAD:ios/scripts/build-rust-bridge.sh)
          $(xcodebuild -version)
          $(uname -m)
          ${BB_APPLE_TARGETS:-all}"
          echo "key=rust-bridge-apple-$(printf '%s' "${inputs}" | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust bridge
        id: bridge-cache
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: |
            ios/BrainBuddyKit/Artifacts/BrainBuddyRustFFI.xcframework
            ios/BrainBuddyKit/Sources/BrainBuddyRustBindings/BrainBuddyRustBindings.swift

      - name: Build the Rust bridge
        if: env.RUN == 'true'
        env:
          BB_APPLE_TARGETS: aarch64-apple-darwin x86_64-apple-darwin
          CACHE_HIT: ${{ steps.bridge-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            echo "Rust bridge restored for these exact inputs; nothing to build"
            exit 0
          fi
          sh ios/scripts/build-rust-bridge.sh apple

      # --only-use-versions-from-resolved-file builds exactly what
      # macos/Package.resolved pins and fails on a stale pin file, instead of
      # resolving afresh from the network and testing dependency versions
      # nobody reviewed. Spelled out on purpose: SwiftPM's shorter alias for
      # the same option looks like a force push to the trunk-delivery contract
      # (scripts/validate_trunk_delivery.py), which rejects that anywhere in
      # CI. The raw logs are kept for the failure artifact.
      - name: Build the package
        if: env.RUN == 'true'
        working-directory: macos
        run: |
          swift build --only-use-versions-from-resolved-file 2>&1 \
            | tee "${RUNNER_TEMP}/macos-swift-build.log"

      # A run that executes no test is a failure, not a pass (021 contract
      # mac-app-host §8, tasks T003). The floor adds both frameworks' own
      # summaries: XCTest's "Executed N tests, with ..." (the largest N is the
      # whole-bundle total) and Swift Testing's "Test run with N tests", so the
      # planned move of the suites to Swift Testing keeps the lane green while
      # an empty run in both still fails. Serial on purpose:
      # under --parallel SwiftPM prints only per-test progress and drops
      # XCTest's summary for passing tests, so the floor would have nothing to
      # read. It is also the run macos/README.md documents.
      - name: Test the package
        if: env.RUN == 'true'
        working-directory: macos
        run: |
          log="${RUNNER_TEMP}/macos-swift-test.log"
          swift test --only-use-versions-from-resolved-file 2>&1 | tee "${log}"
          xctest="$(grep -Eo 'Executed [0-9]+ tests?, with' "${log}" \
            | grep -Eo '[0-9]+' | sort -n | tail -n 1 || true)"
          swift_testing="$(grep -Eo 'Test run with [0-9]+ tests?' "${log}" \
            | grep -Eo '[0-9]+' | sort -n | tail -n 1 || true)"
          executed=$(( ${xctest:-0} + ${swift_testing:-0} ))
          if [ "${executed}" -eq 0 ]; then
            echo "::error::swift test executed no test (XCTest or Swift Testing); the Mac lane fails rather than skips"
            exit 1
          fi
          echo "Executed ${executed} tests (XCTest ${xctest:-0}, Swift Testing ${swift_testing:-0})"

      - name: Upload build logs
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-swift-build.log
            ${{ runner.temp }}/macos-swift-test.log
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # ADR-0004 requirement 2: the pull request's scoped score is compared against
  # the base revision measured over the same scope. An absolute floor alone is
  # not enough -- a module sitting at 99% can shed four points and still clear
  # 95%, one pull request at a time.
  #
  # The base is measured in its OWN job rather than a second directory inside
  # the gate job, and that is the whole point of splitting them: `pip install
  # -e` points at exactly one checkout, so measuring both revisions from one
  # job risks running the base's tests against the head's code and reporting a
  # comparison that is silently meaningless.
  #
  # This job and mutation-head are deliberately independent of each other, so
  # the two campaigns overlap and a pull request pays one campaign's wall-clock
  # rather than two. Only mutation-gate waits, and it just reads two artifacts.
  # A push has no base to measure, so every step below skips in seconds.
  # It does not wait for the backend lane. Queued behind it, the campaign put
  # the whole backend suite in front of ten minutes of mutmut on every landing
  # push -- the longest chain in the run -- and bought nothing a red suite does
  # not already cost: mutmut runs the clean suite first and stops when it
  # fails, so a broken change fails here within minutes too. `changes` carries
  # the enforced-scope decision.
  mutation-base:
    name: Backend mutation base measurement (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    # No job-level `if`: a skipped job fails Full CI (ADR-0008). The steps below
    # carry the condition instead.
    env:
      RUN: ${{ needs.changes.outputs.mutation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      # The base revision is measured with the HEAD revision's allow-list and
      # gate script. Reading either from the base would let a pull request pick
      # its own comparison by editing them.
      - name: Checkout the base revision
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: base/backend/pyproject.toml

      # Spec 026: the backend wheel compiles the PyO3 core bridge (maturin), so
      # every install of it needs the pinned toolchain. Keep the version equal
      # to rust/rust-toolchain.toml and the Rust core lane below.
      - name: Install pinned Rust
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0

      - name: Install the base revision's dependencies
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        working-directory: base/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Measure the complete assigned mutation scope
        if: env.RUN == 'true' && github.event_name == 'pull_request'
        env:
          MUTATION_SCOPE: ${{ needs.changes.outputs.mutation_scope }}
        run: |
          mkdir -p base-stats
          tr ' ' '\n' <<< "${MUTATION_SCOPE}" | sed '/^[[:space:]]*$/d' > /tmp/requested-scope.txt
          : > /tmp/present-scope.txt
          while read -r entry; do
            if [ -f "base/backend/${entry}" ]; then echo "${entry}" >> /tmp/present-scope.txt; fi
          done < /tmp/requested-scope.txt
          python3 scripts/ci_shards.py mutation-select --scope /tmp/present-scope.txt \
            --revision "${{ github.event.pull_request.base.sha }}" --index "${{ matrix.shard }}" \
            --output base-stats/assignment.json
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["assigned"]), end="")' \
            base-stats/assignment.json > /tmp/assigned-scope.txt
          if [ ! -s /tmp/assigned-scope.txt ]; then
            python3 -c 'import json,sys; from scripts.ci_shards import MUTATION_COUNTERS; json.dump(dict.fromkeys(MUTATION_COUNTERS,0),open(sys.argv[1],"w"))' base-stats/mutation-stats.json
            exit 0
          fi
          python3 scripts/mutation_gate.py scope \
            --enforced backend/mutation-enforced-scope.txt \
            --changed /tmp/assigned-scope.txt --apply-to base/backend/pyproject.toml
          cd base/backend
          rm -rf mutants
          set +e
          mutmut run
          mutation_status=$?
          set -e
          echo "mutmut exit status: ${mutation_status}" > "${GITHUB_WORKSPACE}/base-stats/mutation-run-status.txt"
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json "${GITHUB_WORKSPACE}/base-stats/mutation-stats.json"
          mutmut results > "${GITHUB_WORKSPACE}/base-stats/mutation-summary.txt" || true
          mutmut results --all true > "${GITHUB_WORKSPACE}/base-stats/mutation-survivors.txt" || true

      - name: Record complete mutation identities and counts
        if: always() && env.RUN == 'true' && github.event_name == 'pull_request'
        run: |
          python3 scripts/ci_shards.py mutation-record --assignment base-stats/assignment.json \
            --meta base/backend/mutants --stats base-stats/mutation-stats.json \
            --summary base-stats/mutation-summary.txt --raw-state base/backend/mutants \
            --output base-stats/manifest.json

      - name: Upload mutation shard evidence
        if: always() && env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-base-shard-${{ matrix.shard }}
          path: base-stats
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload raw mutmut state
        if: always() && env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-base-raw-${{ matrix.shard }}
          path: base/backend/mutants
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  mutation-head:
    name: Backend mutation head measurement (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.mutation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Set up Python
        if: env.RUN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Spec 026: the backend wheel compiles the PyO3 core bridge (maturin), so
      # every install of it needs the pinned toolchain. Keep the version equal
      # to rust/rust-toolchain.toml and the Rust core lane below.
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0

      # Restores the backend lane's bridge build; never writes it.
      - name: Restore the backend Rust bridge build
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: backend-wheel
          save-if: false

      - name: Install dependencies
        if: env.RUN == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Measure the complete assigned mutation scope
        if: env.RUN == 'true'
        env:
          MUTATION_SCOPE: ${{ needs.changes.outputs.mutation_scope }}
        run: |
          mkdir -p backend/mutation-artifacts
          tr ' ' '\n' <<< "${MUTATION_SCOPE}" | sed '/^[[:space:]]*$/d' > /tmp/requested-scope.txt
          cp /tmp/requested-scope.txt /tmp/present-scope.txt
          python3 scripts/ci_shards.py mutation-select --scope /tmp/present-scope.txt \
            --revision "${BRAIN_BUDDY_CANDIDATE_SHA}" --index "${{ matrix.shard }}" \
            --output backend/mutation-artifacts/assignment.json
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["assigned"]), end="")' \
            backend/mutation-artifacts/assignment.json > /tmp/assigned-scope.txt
          if [ ! -s /tmp/assigned-scope.txt ]; then
            python3 -c 'import json,sys; from scripts.ci_shards import MUTATION_COUNTERS; json.dump(dict.fromkeys(MUTATION_COUNTERS,0),open(sys.argv[1],"w"))' backend/mutation-artifacts/mutation-stats.json
            exit 0
          fi
          python3 scripts/mutation_gate.py scope \
            --enforced backend/mutation-enforced-scope.txt \
            --changed /tmp/assigned-scope.txt --apply-to backend/pyproject.toml
          cd backend
          rm -rf mutants
          set +e
          mutmut run
          mutation_status=$?
          set -e
          echo "mutmut exit status: ${mutation_status}" > "${GITHUB_WORKSPACE}/backend/mutation-artifacts/mutation-run-status.txt"
          mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json "${GITHUB_WORKSPACE}/backend/mutation-artifacts/mutation-stats.json"
          mutmut results > "${GITHUB_WORKSPACE}/backend/mutation-artifacts/mutation-summary.txt" || true
          mutmut results --all true > "${GITHUB_WORKSPACE}/backend/mutation-artifacts/mutation-survivors.txt" || true

      - name: Record complete mutation identities and counts
        if: always() && env.RUN == 'true'
        run: |
          python3 scripts/ci_shards.py mutation-record --assignment backend/mutation-artifacts/assignment.json \
            --meta backend/mutants --stats backend/mutation-artifacts/mutation-stats.json \
            --summary backend/mutation-artifacts/mutation-summary.txt --raw-state backend/mutants \
            --output backend/mutation-artifacts/manifest.json

      - name: Upload mutation shard evidence
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-head-shard-${{ matrix.shard }}
          path: backend/mutation-artifacts
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload raw mutmut state
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-head-raw-${{ matrix.shard }}
          path: backend/mutants
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  mutation-gate:
    name: Backend mutation gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
      - mutation-base
      - mutation-head
    env:
      RUN: ${{ needs.changes.outputs.mutation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"
      - name: Download available head measurements
        if: always() && env.RUN == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mutation-head-shard-*
          path: head-shards
      - name: Download available base measurements
        if: always() && env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mutation-base-shard-*
          path: base-shards
      - name: Independently read the present base scope
        if: always() && env.RUN == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-source
      - name: Combine complete mutation measurements
        if: always() && env.RUN == 'true'
        env:
          MUTATION_SCOPE: ${{ needs.changes.outputs.mutation_scope }}
        run: |
          tr ' ' '\n' <<< "${MUTATION_SCOPE}" | sed '/^[[:space:]]*$/d' > /tmp/head-scope.txt
          python3 scripts/ci_shards.py mutation-merge --artifacts head-shards \
            --expected-scope /tmp/head-scope.txt --sha "${BRAIN_BUDDY_CANDIDATE_SHA}" \
            --output-dir backend/mutation-artifacts
          if [ "${{ github.event_name }}" = pull_request ]; then
            : > /tmp/base-scope.txt
            while read -r entry; do
              if [ -f "base-source/backend/${entry}" ]; then echo "${entry}" >> /tmp/base-scope.txt; fi
            done < /tmp/head-scope.txt
            python3 scripts/ci_shards.py mutation-merge --artifacts base-shards \
              --expected-scope /tmp/base-scope.txt --sha "${{ github.event.pull_request.base.sha }}" \
              --output-dir base-stats
          fi
          test "${{ needs.mutation-head.result }}" = success
          test "${{ needs.mutation-base.result }}" = success

      - name: Create blocking-gate Allure evidence
        if: always() && env.RUN == 'true'
        run: |
          mkdir -p backend/mutation-gate-allure-results
          for evidence in mutation-summary.txt mutation-survivors.txt; do
            if [ -f "backend/mutation-artifacts/${evidence}" ]; then
              cp "backend/mutation-artifacts/${evidence}" backend/mutation-gate-allure-results/
            else
              echo "the campaign did not produce ${evidence}; see the raw mutmut state" \
                > "backend/mutation-gate-allure-results/${evidence}"
            fi
          done
          python3 scripts/create_mutation_allure_evidence.py \
            --mode blocking-gate \
            --scope-label backend \
            --summary backend/mutation-gate-allure-results/mutation-summary.txt \
            --survivors backend/mutation-gate-allure-results/mutation-survivors.txt \
            --output backend/mutation-gate-allure-results/mutation-gate-result.json

      - name: Upload blocking-gate Allure evidence
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-gate-allure-results
          path: backend/mutation-gate-allure-results
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload combined mutation statistics and diagnostics
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-gate-artifacts
          path: |
            backend/mutation-artifacts
            base-stats
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Enforce the mutation gate
        if: env.RUN == 'true'
        run: |
          base_args=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            base_args=(--base-stats base-stats/mutation-stats.json)
          fi
          python3 scripts/mutation_gate.py check \
            --stats backend/mutation-artifacts/mutation-stats.json "${base_args[@]}"

  # Proves the production Dockerfiles still build. This is a required status
  # check on main (docs/autonomous-delivery-runbook.md), so the job name is
  # load-bearing and must not be renamed.
  #
  # An independent lane. It used to wait on `e2e` for cache locality -- the two
  # build byte-identical images, and ordered after E2E this build was a sure
  # hit on the cache E2E had just written. That saved about forty seconds of a
  # runner nobody was waiting on and put the same forty seconds, plus a job
  # start, on the end of the longest chain in the run. In parallel this reads
  # the `stack-*` cache `main` last wrote, exactly as E2E does, and a service
  # the change touched rebuilds here too; it still finishes long before E2E.
  #
  # It keeps the diagnostic value of a separate check: when E2E goes red,
  # `Docker Images` says at a glance whether the images built or the journeys
  # failed. It does not wait on the iOS lanes, which ship in neither image.
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the Actions cache service to buildx
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Reads the same cache scopes the E2E lane writes, and deliberately does
      # not write them back: the two jobs build byte-identical layers, so a
      # second writer would only spend the repository's shared 10 GB cache quota
      # storing a duplicate -- and evict the npm and pip caches the other lanes
      # depend on to do it.
      #
      # type=cacheonly: this job proves the Dockerfile builds, it never runs the
      # image, so exporting one would be pure cost.
      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            docker buildx build \
              --file backend/Dockerfile \
              --cache-from "type=gha,scope=stack-backend" \
              --output type=cacheonly . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

      # Same build args as the E2E lane, so both resolve to the same layers and
      # therefore to the same cache entries.
      - name: Build frontend image
        run: |
          for attempt in 1 2 3; do
            docker buildx build \
              --file frontend/Dockerfile \
              --cache-from "type=gha,scope=stack-frontend" \
              --build-arg VITE_API_BASE_URL=/api \
              --output type=cacheonly . && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done

  # The whole-stack lane, and the most expensive job in the run.
  #
  # It is NEVER path filtered: it is the only check that exercises the backend
  # and the frontend against each other, so "nothing in my stack changed" is not
  # a reason to skip it -- a change on either side of the wire can break the pair
  # while both services' own suites stay green.
  #
  # It is an independent lane. It used to wait for `backend` and `frontend` so
  # a failing unit test stopped the run before the stack booted, but the backend
  # lane is not a cheap check: queued behind it, E2E started twenty minutes
  # into the run and was the longest chain in the workflow. A red unit test
  # still fails the run; it just no longer delays every green one. It needs
  # neither `docker` nor the native lanes, none of which feed the Compose stack.
  e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-latest
    env:
      # Pinned so the prebuilt images below are exactly what Compose starts.
      BRAIN_BUDDY_BACKEND_IMAGE: brain-buddy-backend:ci
      BRAIN_BUDDY_FRONTEND_IMAGE: brain-buddy-frontend:ci
      BRAIN_BUDDY_A2A_HELLOWORLD_IMAGE: brain-buddy-a2a-helloworld:ci
      BRAIN_BUDDY_HERMES_A2A_IMAGE: brain-buddy-hermes-a2a:ci
      # Pull-request runs must bind evidence to the reviewed head rather than
      # GitHub's synthetic merge commit. Non-PR runs bind to github.sha.
      BRAIN_BUDDY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium browser
        working-directory: frontend
        run: |
          if [ -f /etc/apt/sources.list.d/google-chrome.list ]; then
            sudo mv /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.disabled
          fi
          if [ -f /etc/apt/sources.list.d/google-chrome.sources ]; then
            sudo mv /etc/apt/sources.list.d/google-chrome.sources /etc/apt/sources.list.d/google-chrome.sources.disabled
          fi
          npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # buildx talks to the Actions cache service through these two variables. A
      # `run:` step does not receive them the way a build action does, and
      # exporting them here keeps a third-party action out of a
      # candidate-controlled workflow. If the service is unreachable the cache
      # simply misses and the image builds from scratch: this fails toward doing
      # MORE work, never toward starting a stale service.
      - name: Expose the Actions cache service to buildx
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # This is what "services from main, only the change rebuilt" buys. GitHub
      # scopes its cache so a branch reads the DEFAULT BRANCH's entries: a
      # service this branch did not touch restores main's layers and is ready in
      # seconds, while a service it did touch misses from the first changed
      # layer on and rebuilds. Nothing here branches on the diff -- the layers
      # are content addressed, so the cache decides, and it can only ever be
      # wrong in the direction of rebuilding too much.
      #
      # Only a push to main writes the layers back. An entry written by a pull
      # request or a merge group is readable by that ref alone, so those writes
      # were never reused by anyone else -- yet they filled most of the shared
      # 10 GB quota and evicted main's own pip, npm and bridge caches.
      - name: Build the stack images, reusing main's layers
        env:
          WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # build <dockerfile> <tag> <cache-scope> [extra buildx args...]
          build() {
            local dockerfile="$1" tag="$2" scope="$3"
            shift 3
            local cache_to=()
            if [ "${WRITE_CACHE}" = true ]; then
              cache_to=(--cache-to "type=gha,mode=max,scope=stack-${scope}")
            fi
            for attempt in 1 2 3; do
              docker buildx build \
                --file "${dockerfile}" \
                --tag "${tag}" \
                --cache-from "type=gha,scope=stack-${scope}" \
                "${cache_to[@]}" \
                "$@" --load . && return 0
              if [ "${attempt}" = 3 ]; then return 1; fi
              sleep "$((attempt * 10))"
            done
          }
          build backend/Dockerfile "${BRAIN_BUDDY_BACKEND_IMAGE}" backend
          # Same value run_playwright_e2e.sh gives Compose: the frontend bakes
          # its API base in at build time, so a prebuilt image must be built
          # with the one the E2E stack actually serves.
          build frontend/Dockerfile "${BRAIN_BUDDY_FRONTEND_IMAGE}" frontend \
            --build-arg VITE_API_BASE_URL=/api
          # The two reference runtimes the relay stories drive (014-FR-017).
          # Through the same helper for the same reason: their layers are cached
          # against main like everything else, and --no-build below fails closed
          # if either tag is missing rather than building an unpinned agent.
          build scripts/fixtures/a2a-helloworld/Dockerfile \
            "${BRAIN_BUDDY_A2A_HELLOWORLD_IMAGE}" a2a-helloworld
          build scripts/fixtures/hermes-a2a/Dockerfile \
            "${BRAIN_BUDDY_HERMES_A2A_IMAGE}" hermes-a2a

      - name: Set up Python for the isolated modern auth browser fixture
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Spec 026: the backend wheel compiles the PyO3 core bridge (maturin), so
      # every install of it needs the pinned toolchain. Keep the version equal
      # to rust/rust-toolchain.toml and the Rust core lane below.
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0

      # Restores the backend lane's bridge build; never writes it.
      - name: Restore the backend Rust bridge build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: backend-wheel
          save-if: false

      - name: Install modern auth fixture runtime dependencies
        run: python -m pip install ./backend

      - name: Run Compose smoke and Playwright E2E
        env:
          # The images are already built and tagged above, so Compose starts
          # exactly those. --no-build (see run_playwright_e2e.sh) fails closed if
          # one is missing rather than quietly building an unpinned replacement.
          BRAIN_BUDDY_E2E_BUILD_IMAGES: "0"
        run: |
          # make test-e2e invokes npm run test:e2e after the Compose stack is ready.
          make test-e2e

      - name: Validate Playwright Allure results
        if: always()
        run: |
          python3 scripts/validate_ci_artifacts.py results --path frontend/allure-results/playwright --label playwright-e2e --since-file frontend/allure-results/playwright/.run-started-at
          python3 scripts/validate_ci_artifacts.py product-e2e-results --path frontend/allure-results/playwright

      - name: Upload Playwright Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-allure-results
          path: frontend/allure-results/playwright
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: frontend/playwright-report
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload Playwright failure artifacts and Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # The CLI ships as its own Cargo workspace (cli/), so like the stack lanes it
  # always runs and gates its steps on RUN, reporting success rather than
  # "skipped" when nothing it builds changed (ADR-0008). A target with nothing
  # to do takes the Linux no-op path instead of queueing a macOS or Windows
  # runner. The x86_64 Linux target is the exception: its task journey drives
  # the real backend, so a backend change runs that one target as well.
  cli-native:
    name: CLI native (${{ matrix.target }})
    needs: changes
    runs-on: ${{ (needs.changes.outputs.cli == 'true' || (matrix.target == 'x86_64-unknown-linux-gnu' && needs.changes.outputs.backend == 'true')) && matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    env:
      RUN: ${{ (needs.changes.outputs.cli == 'true' || (matrix.target == 'x86_64-unknown-linux-gnu' && needs.changes.outputs.backend == 'true')) && 'true' || 'false' }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Set up native Python
        if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action, fixed toolchain
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      # Per target. Written only from main, which in practice means the nightly
      # run: a main push whose SHA passed the merge queue leaves this lane idle.
      - name: Cache the CLI build
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure Linux native store
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11 pkg-config
          mkdir -m 700 "${RUNNER_TEMP}/bb-keyring" "${RUNNER_TEMP}/bb-runtime"
      - name: Format, lint, behavioral tests and release binary
        if: env.RUN == 'true'
        shell: bash
        run: |
          cd cli
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --tests
          cargo build --locked --release
      - name: Exercise real backend task journey
        if: env.RUN == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e './backend[dev]'
          BB_TEST_CLI_BINARY="${PWD}/cli/target/release/bb" BB_TEST_BACKEND_PYTHON="${PWD}/backend/.venv/bin/python" cargo test --locked --manifest-path cli/Cargo.toml --test task_journey -- --ignored
      - name: Execute Linux native credential and installer checks
        if: env.RUN == 'true' && runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/bb-keyring
          XDG_RUNTIME_DIR: ${{ runner.temp }}/bb-runtime
        run: |
          dbus-run-session -- bash -e <<'BB_NATIVE'
            printf synthetic-native-store-password | gnome-keyring-daemon --unlock --components=secrets
            python3 scripts/check_cli_native.py --target "${{ matrix.target }}" --source-sha "${CANDIDATE_SHA}" --binary cli/target/release/bb --output cli/target/native-evidence.json
          BB_NATIVE
      - name: Execute macOS15 native credential and installer checks
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          original_keychain=$(security default-keychain -d user | tr -d '"' | xargs)
          fixture_keychain="${RUNNER_TEMP}/bb-cli.keychain-db"
          trap 'security default-keychain -d user -s "$original_keychain"; security delete-keychain "$fixture_keychain"' EXIT
          security create-keychain -p synthetic-native-store-password "$fixture_keychain"
          security set-keychain-settings -lut 1800 "$fixture_keychain"
          security unlock-keychain -p synthetic-native-store-password "$fixture_keychain"
          security default-keychain -d user -s "$fixture_keychain"
          python3 scripts/check_cli_native.py --target "${{ matrix.target }}" --source-sha "${CANDIDATE_SHA}" --binary cli/target/release/bb --output cli/target/native-evidence.json
      - name: Execute Windows native credential and installer checks
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/check_cli_native.py --target "${{ matrix.target }}" --source-sha "$env:CANDIDATE_SHA" --binary cli/target/release/bb.exe --output cli/target/native-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package exact native output
        if: env.RUN == 'true'
        shell: bash
        run: |
          binary=cli/target/release/bb
          if [ "${{ runner.os }}" = Windows ]; then binary=cli/target/release/bb.exe; fi
          python scripts/build_cli_release.py package --target "${{ matrix.target }}" --source-sha "${CANDIDATE_SHA}" --version 0.1.0 --binary "$binary" --evidence cli/target/native-evidence.json --output cli/target/native-package
      - name: Upload native archives and checks
        if: env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bb-native-${{ matrix.target }}
          path: cli/target/native-package/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  cli-artifacts:
    name: CLI release artifacts
    runs-on: ubuntu-22.04
    needs:
      - changes
      - cli-native
    env:
      # Aggregates all five native outputs, which only exist when the CLI
      # itself changed; a backend-only run builds just the Linux journey target.
      RUN: ${{ needs.changes.outputs.cli }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Download five native outputs
        if: env.RUN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bb-native-*
          path: cli/target/native-input
      - name: Validate and assemble versioned release
        if: env.RUN == 'true'
        run: |
          python3 -m unittest scripts/test_build_cli_release.py -v
          python3 scripts/build_cli_release.py aggregate --source-sha "${CANDIDATE_SHA}" --version 0.1.0 --input cli/target/native-input --output cli/target/release-package
      - name: Upload reviewed release candidate
        if: env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bb-release-0.1.0
          path: cli/target/release-package/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # backend-results, frontend and e2e are real data dependencies: this job
  # downloads the Allure results each of them uploads, and they are the only
  # three that emit any. Playwright's results arrive with `e2e`.
  #
  # Everything else is here for a different reason: this report is the run's
  # closing artifact and the pull request comment points at it, so it must not
  # be generated while any job can still change the verdict.
  #
  # That is why the list is EVERY job but `full-ci` rather than only the three
  # that produce results. Naming just the evidence producers, or only those plus
  # `docker`, left "last" true by coincidence: `mutation-head` carries
  # timeout-minutes: 90, so on a change that touches the enforced backend scope
  # mutmut runs far longer than E2E and Docker together, and the report would
  # publish its link while `mutation-gate` was still deciding. The rule is
  # checked by `scripts/validate_ci_artifacts.py workflow`, so a new job cannot
  # quietly start finishing after the report that claims to summarise it.
  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs:
      - cli-native
      - cli-artifacts
      - rust
      - workflow-lint
      - secret-scan
      - changes
      - spec-kit
      - backend
      - backend-results
      - frontend
      - ios-kit
      - ios-app
      - ios-tests
      - macos-app
      - mutation-base
      - mutation-head
      - mutation-gate
      - docker
      - e2e
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$BRAIN_BUDDY_CANDIDATE_SHA"

      # Three artifacts match the `*-allure-results` pattern downloaded below,
      # and the predicate has to account for every one of them:
      # `backend-allure-results`, `frontend-allure-results` and
      # `playwright-allure-results`. When a change
      # produces none of them the download matches no artifact, and
      # `actions/download-artifact` does not create the directory — the
      # validator then failed on a directory that was never going to exist.
      # Every specs-only commit hit this, which is most of a spec-driven
      # feature's history.
      #
      # This comment used to claim that only `backend` and `frontend` upload
      # results, that `e2e` "derives its own RUN from those two", and that
      # the (since removed) Expo `mobile` lane produced none at all. All three
      # had stopped being true, and the predicate below was built on them.
      #
      # Deliberately a step-level short circuit and not a job-level `if`:
      # `full-ci` counts a skipped required job as a failure on purpose, so
      # skipping this job would trade one red build for another.
      #
      # It must stay this narrow. "A stack ran and produced no results" is a
      # real defect and still fails here — that is the whole point of the
      # validator, and this repository has now found that defect three times.
      - name: Decide whether there is anything to aggregate
        id: aggregate
        # Selected-to-run is NOT the same question as produced-something, and
        # the first version of this asked the wrong one. `changes` can mark a
        # stack changed while its job is still skipped -- a cancelled run, or a
        # failed `changes` job that every stack lane needs. The predicate must
        # be the conjunction: the stack was selected AND its job actually ran.
        #
        # Deliberately NOT "skip if the directory is empty". That would swallow
        # the one case this validator exists for: a stack that ran and produced
        # no results.
        #
        # E2E is the third uploading lane and it is asked a DIFFERENT question,
        # because it is filtered differently. The stack lanes are path
        # filtered, so for them "was this selected" is a real question. `e2e` is
        # never path filtered (see the job) and it uploads
        # `playwright-allure-results` under a bare `always()` with no RUN guard,
        # so it produces evidence on every run it is part of — including a
        # docs-only one. There is no `changes.outputs.e2e` to conjoin and there
        # must not be; the only question left is whether the job ran.
        #
        # Omitting that term is what this fixes. A docs-only pull request marks
        # every stack false, yet `backend` and `frontend` still RUN with
        # their steps skipped (see the `changes` job: skipping the jobs would
        # trip ADR-0008), so `e2e` is not skipped either — it runs the whole
        # Compose stack and uploads a full set of Playwright results. The
        # stack-only predicate then short-circuited to run=false and threw them
        # away: no aggregate report and no pull request link, on precisely the
        # branches that are nothing but docs commits.
        env:
          BACKEND: ${{ needs.changes.outputs.backend == 'true' && needs.backend.result != 'skipped' }}
          FRONTEND: ${{ needs.changes.outputs.frontend == 'true' && needs.frontend.result != 'skipped' }}
          E2E: ${{ needs.e2e.result != 'skipped' }}
        run: |
          if [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ] || [ "$E2E" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "A lane that uploads Allure results was exercised; aggregating."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No lane that uploads Allure results was exercised, so there is nothing to aggregate. Nothing to validate."
          fi

      - name: Download Allure results
        if: steps.aggregate.outputs.run == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Validate aggregate Allure results
        if: steps.aggregate.outputs.run == 'true'
        run: python3 scripts/validate_allure_taxonomy.py --path allure-results --label aggregate-allure

      - name: Set up Node.js
        if: steps.aggregate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Allure Report 3 CLI
        if: steps.aggregate.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Generate Allure Report 3 HTML
        if: steps.aggregate.outputs.run == 'true'
        run: |
          cd frontend
          npx allure generate ../allure-results -o ../allure-report

      # Additional to the report above, never a replacement: the multi-file
      # report is the complete one and carries the attachments. This one is a
      # single self-contained file a reviewer can open without a local server.
      - name: Generate the single-file Allure report
        if: steps.aggregate.outputs.run == 'true'
        run: |
          cd frontend
          npx allure awesome ../allure-results --single-file -o ../allure-report-single

      - name: Upload Allure HTML report
        if: always() && steps.aggregate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload the single-file Allure report
        if: always() && steps.aggregate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          # The file, not its directory. `allure awesome --single-file` writes
          # summary.json beside it -- correct generator output, but an artifact
          # called "single file" that unzips to two is a small lie.
          name: allure-report-single-file
          path: allure-report-single/index.html
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Post PR Allure report link
        if: always() && steps.aggregate.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- brain-buddy-allure-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Retention is stated per event because this comment only ever
            // posts on a pull request, where artifacts live 7 days; the copy it
            // replaces claimed 30 unconditionally. The policy itself is unchanged.
            const body = [
              marker,
              `**Allure Report 3** for this run: [open the run](${runUrl}) and download either artifact.`,
              '',
              '- **Start here: `allure-report-single-file`** - unzip GitHub\'s artifact envelope and open the single `index.html`. No local server needed.',
              '- **`allure-report-html`** - the complete report, including test attachments. A directory of files: unzip it and serve it locally.',
              '',
              'Artifacts are retained for **7 days** on a pull request and **30 days** on a push.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Every run re-earns the right to believe the verdict below: the canary
      # runs the same CLI and the same allurerc.mjs over two fixtures that
      # differ in one `status` field, so a gate that stopped reacting to a
      # failed result cannot keep reporting success.
      - name: Prove the quality gate can still fail
        if: always() && steps.aggregate.outputs.run == 'true'
        run: ./scripts/allure_quality_gate_selftest.sh

      # LAST STEP, deliberately. Both uploads and the pull-request comment run
      # before the verdict and carry `if: always()`, so a red gate still leaves
      # behind the report that explains it.
      - name: Enforce the Allure quality gate
        if: steps.aggregate.outputs.run == 'true'
        run: |
          cd frontend
          npx allure quality-gate ../allure-results --config ../allurerc.mjs

  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - secret-scan
      - changes
      - spec-kit
      - backend
      - backend-results
      - frontend
      - ios-kit
      - ios-app
      - ios-tests
      - macos-app
      - mutation-base
      - mutation-head
      - mutation-gate
      - docker
      - e2e
      - allure-report
      - cli-native
      - cli-artifacts
      - rust
    if: always()
    steps:
      - name: Require successful CI, mutation gate, Docker, E2E, and Allure report
        run: |
          # A skipped required job must fail too: with `if: always()` here, a
          # skipped dependency would otherwise let Full CI pass vacuously.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required CI jobs failed, were cancelled, or were skipped." >&2
            exit 1
          fi
          echo "Full CI passed."
